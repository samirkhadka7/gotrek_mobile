name: gotrek
description: "GoTrek - Nepal Trekking & Hiking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.6.0
  connectivity_plus: ^6.0.5
  pretty_dio_logger: ^1.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Functional Programming
  dartz: ^0.10.1

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Socket.IO for real-time chat
  socket_io_client: ^2.0.3+1

  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # WebView for Payment
  webview_flutter: ^4.9.0

  # Sensors
  sensors_plus: ^6.1.1
  pedometer: ^4.1.1

  # Biometric Authentication
  local_auth: ^2.3.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.2.3

  # Form Validation
  formz: ^0.7.0

  # Markdown Support
  flutter_markdown: ^0.7.4+3

  # UUID Generation
  uuid: ^4.5.1

  # HTTP
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  injectable_generator: ^2.6.2
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  test_cov_console: ^0.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
    # Poppins fonts - uncomment when font files are added
    # - family: Poppins
    #   fonts:
    #     - asset: assets/fonts/Poppins-Regular.ttf
    #     - asset: assets/fonts/Poppins-Medium.ttf
    #       weight: 500
    #     - asset: assets/fonts/Poppins-SemiBold.ttf
    #       weight: 600
    #     - asset: assets/fonts/Poppins-Bold.ttf
    #       weight: 700
